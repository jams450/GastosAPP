services:
  # Frontend Next.js
  frontend:
    build:
      context: ./GastosApp.Web
      dockerfile: Dockerfile
    container_name: gastos-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=${API_BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_ENFORCE=${CSRF_ENFORCE}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    depends_on:
      - api
    networks:
      - gastos-network
    restart: "no"

  # API .NET
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gastos-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Cors__AllowedOrigins=${Cors__AllowedOrigins}
      - Telegram__Enabled=${Telegram__Enabled}
      - Telegram__BotToken=${Telegram__BotToken}
      - Telegram__WebhookSecret=${Telegram__WebhookSecret}
      - Telegram__AllowedUserId=${Telegram__AllowedUserId}
      - Telegram__AppUserId=${Telegram__AppUserId}
      - Llm__BaseUrl=${Llm__BaseUrl}
      - Llm__ApiKey=${Llm__ApiKey}
      - Llm__Model=${Llm__Model}
    networks:
      - gastos-network
      - server-data
    restart: "no"

networks:
  gastos-network:
    driver: bridge
  server-data:
    external: true
