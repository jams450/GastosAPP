services:
  # Frontend Next.js
  frontend:
    build:
      context: ./GastosApp.Web
      dockerfile: Dockerfile
    container_name: gastos-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=${API_BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_ENFORCE=${CSRF_ENFORCE}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    depends_on:
      - api
    networks:
      - gastos-network
    restart: "no"

  # API .NET
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gastos-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STR}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Auth__Username=${Auth__Username}
      - Auth__Password=${Auth__Password}
      - Encryption__Key=${Encryption__Key}
      - Encryption__IV=${Encryption__IV}
      - Cors__AllowedOrigins=${Cors__AllowedOrigins}
    depends_on:
      - postgres
    networks:
      - gastos-network
    restart: "no"

  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: gastos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gastos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SQL/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gastos-network
    restart: "no"

volumes:
  postgres_data:
    driver: local

networks:
  gastos-network:
    driver: bridge
